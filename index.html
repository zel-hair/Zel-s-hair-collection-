<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZEL'S HAIR COLLECTION</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Announcement Strip -->
    <div class="announcement-strip">
        QUALITY HAIR <span>·</span> CONFIDENCE <span>·</span> ALWAYS
    </div>

    <!-- Main Header -->
    <header class="site-header">

        <!-- Hamburger Menu -->
        <button class="header-icon menu-button"
                type="button"
                aria-label="Open menu">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7H21"></path>
                <path d="M3 12H21"></path>
                <path d="M3 17H21"></path>
            </svg>

        </button>

        <!-- Brand Name -->
        <a href="index.html" class="brand-name">
            Zel's Hair Collection
        </a>

        <!-- Header Actions -->
        <div class="header-actions">

            <!-- Search -->
            <button class="header-icon search-button"
                    type="button"
                    aria-label="Search products">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="7"></circle>
                    <path d="M16 16L21 21"></path>
                </svg>

            </button>

            <!-- Shopping Bag -->
            <button class="header-icon cart-button"
                    type="button"
                    aria-label="Shopping bag">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 8H19L20 21H4L5 8Z"></path>
                    <path d="M9 9V6A3 3 0 0 1 15 6V9"></path>
                </svg>

                <span class="cart-count">0</span>

            </button>

        </div>

    </header>

    <script src="script.js"></script>

</body>
</html>
<!-- HERO SECTION -->

<main>

    <section class="hero">

        <!-- HERO BACKGROUND IMAGE -->

        <img
            src="887163C7-315F-48C0-93D7-AA91440A881D.png"
            alt="Zel's Hair Collection campaign"
            class="hero-image"
        >

        <!-- BURGUNDY IMAGE OVERLAY -->

        <div class="hero-overlay"></div>

        <!-- HERO CONTENT -->

        <div class="hero-content">

            <h1>Zel's Hair Collection</h1>

            <p>
                Looking for hair to complete your next look,
                or ready to book an appointment for your next
                installation? Explore our hair collection or
                find out more about our appointment services below.
            </p>

            <!-- HERO BUTTONS -->

            <div class="hero-buttons">

                <a href="shop.html" class="hero-btn shop-btn">
                    SHOP HAIR
                </a>

                <a href="appointments.html" class="hero-btn appointment-btn">
                    BOOK AN APPOINTMENT
                </a>

            </div>

        </div>

    </section>

</main>
